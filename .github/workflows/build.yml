name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android folder
        run: |
          flutter create --platforms=android --org com.partsez --project-name partsez_rec _tmp
          cp -r _tmp/android ./android
          rm -rf _tmp

      - name: Patch minSdk, label, manifest
        run: |
          sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Partsez RecVideo"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M
          sed -i 's#</application>#<service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="overlay"/></service>\n    </application>#' $M
          cat $M

      - run: flutter pub get

      - name: Fix old plugin gradle (jcenter removed)
        run: |
          for d in $HOME/.pub-cache/hosted/pub.dev/video_thumbnail-*/android; do
            sed -i 's/jcenter()/mavenCentral()/g' $d/build.gradle
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' $d/build.gradle
            grep -q namespace $d/build.gradle || sed -i "0,/android {/s//android {\n    namespace 'xyz.justsoft.video_thumbnail'/" $d/build.gradle
            cat $d/build.gradle
          done

      - name: Build 3 APKs (arm64, armv7, x86_64)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: partsez-recvideo-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
